name: Tarik Data Google Sheets
on:
  schedule:
    # Mengatur jadwal otomatis (contoh: berjalan setiap jam)
    - cron: '0 * * * *'
  workflow_dispatch: # Agar Anda bisa klik tombol "Run" manual kapan saja

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Tarik Data
        uses: githubnext/flat@v1
        with:
          # Tempelkan LINK CSV hasil "Publish to web" tadi di sini
          http_url: 'https://google.com'
          downloaded_filename: data.csv # Nama file yang akan disimpan di GitHub
