name: Tarik Data Google Sheets
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      
      - name: Unduh CSV Google Sheets
        run: |
          curl -L -o data.csv 'https://google.com'
          
      - name: Simpan dan Perbarui di GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update data otomatis dari Google Sheets" && git push)
